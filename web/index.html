<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mecho OS garage operating system.">
  <meta name="theme-color" content="#1d1dff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mecho OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Mecho OS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #fff;
      transition: opacity 180ms ease;
    }

    #app-loading img {
      width: min(42vw, 220px);
      height: min(42vw, 220px);
      object-fit: contain;
    }

    #app-loading-spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e8e8ff;
      border-top-color: #1d1dff;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }

    #app-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes app-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading-spinner {
        animation-duration: 2s;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Loading Mecho OS">
    <img src="assets/assets/logos/mecho_logo.png" alt="Mecho OS">
    <div id="app-loading-spinner" aria-hidden="true"></div>
  </div>
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.classList.add('is-hidden');
      window.setTimeout(function () {
        loading.remove();
      }, 200);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
