static_sites:
  - name: mecho-os-web
    buildCommand: |
      git clone --depth 1 --branch 3.35.1 https://github.com/flutter/flutter.git /tmp/flutter
      /tmp/flutter/bin/flutter config --enable-web
      /tmp/flutter/bin/flutter pub get
      /tmp/flutter/bin/flutter build web --release
    publishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
