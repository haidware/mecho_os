name: mecho_os
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  supabase_flutter: ^2.15.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  share_plus: ^10.1.0
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  path_provider: ^2.1.4
  screenshot: ^3.0.0
  printing: ^5.13.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/mecho_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logos/mecho_logo.png
    - assets/images/garage_left.png
    - assets/images/garage_right.png
